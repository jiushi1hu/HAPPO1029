# Complete five-year cascade HAPPO configuration; no generic game defaults.
device:
  torch_threads: 1
train:
  n_rollout_threads: 6  # One complete episode per independent worker and update.
  episode_length: 1825  # Five-year daily horizon; leap days are retained.
  use_valuenorm: true
  use_linear_lr_decay: false
  use_proper_time_limits: true
model:
  # Actor inputs: 15 local/neighbor features (11 without supplied daily limits).
  # The centralized critic separately receives 38/18 system-state values.
  # Flattened encoder [64, 128, 256] + one 256-unit hidden head.
  # Actors and the critic build separate MLPs with this same layout.
  hidden_sizes: [64, 128, 256, 256]
  activation_func: relu
  use_feature_normalization: false
  initialization_method: orthogonal_
  gain: 0.01
  lr: 0.0003
  critic_lr: 0.0003
  opti_eps: 0.00001
  weight_decay: 0
  action_distribution: categorical
  action_bins: 100
algo:
  gamma: 0.99  # GAE, gamma**t actor/entropy weights and episode accounting; 1 = undiscounted total.
  gae_lambda: 0.95
  share_param: false
  fixed_order: false
  ppo_epoch: 5
  target_kl: null  # Opt-in trial: --ppo-epochs 20 --target-kl 0.01; baseline stays unchanged.
  kl_rollback: false  # With target_kl, reject and restore crossing optimizer steps when explicitly enabled.
  joint_target_kl: null  # Opt-in common-rollout five-actor command KL budget; requires kl_rollback.
  critic_epoch: 5
  actor_num_mini_batch: 1  # Keep every row of the 1825 x 6 rollout.
  critic_num_mini_batch: 1
  clip_param: 0.2
  use_clipped_value_loss: false
  use_huber_loss: false
  huber_delta: 10.0
  value_loss_coef: 1
  use_max_grad_norm: true
  max_grad_norm: 0.5
  use_gae: true
  use_policy_active_masks: true
  action_aggregation: prod
  entropy_coef: 0.001
  normalize_shared_advantages: true
  mask_inactive_factors: true
experiment:
  collection_mode: five_year_parallel
  evaluation_years: [1998, 1999, 1970, 1997, 2006]  # The other 55 source years are used for training.
  evaluation_labels: [extremely_wet, wet, normal, dry, extremely_dry]
  episode_mode: random_training_window
  episodes: 300  # Completed five-year episodes per seed; divisible by six workers (50 updates).
  log_interval: 1  # Diagnostic reporting cadence in HAPPO update rounds.
  seeds: [1, 2, 3, 4, 5]
