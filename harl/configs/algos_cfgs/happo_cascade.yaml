# Deep overrides of happo.yaml; all other algorithm behavior is reused.
device:
  cuda: false
  torch_threads: 1
train:
  n_rollout_threads: 1  # Annual environments collected sequentially; batching is below.
  episode_length: 365  # Reallocated to 365/366 for each sampled calendar year.
  use_valuenorm: true
  use_linear_lr_decay: false
  use_proper_time_limits: true
model:
  # Actor inputs: 16 local/neighbor features (11 without seasonal rules).
  # The centralized critic separately receives 43/18 system-state values.
  hidden_sizes: [128, 128]
  activation_func: tanh
  use_feature_normalization: false
  lr: 0.0003
  critic_lr: 0.0003
  action_distribution: categorical
  action_bins: 200
algo:
  gamma: 0.99  # GAE, gamma**t actor/entropy weights, accounting and selection; 1 = annual total.
  gae_lambda: 0.95
  share_param: false
  fixed_order: false
  ppo_epoch: 5
  target_kl: null  # Opt-in trial: --ppo-epochs 20 --target-kl 0.01; baseline stays unchanged.
  critic_epoch: 5
  actor_num_mini_batch: 1  # Keep all days; same update count in leap/non-leap years.
  critic_num_mini_batch: 1
  use_clipped_value_loss: false
  use_huber_loss: false
  max_grad_norm: 0.5
  entropy_coef: 0.001
  normalize_shared_advantages: true
  mask_inactive_factors: true
experiment:
  training_years: null  # Default: all years outside holdouts; --training-years selects an explicit subset.
  validation_years: [2020, 2021, 2022, 2023, 2024]
  test_years: [1998, 1999, 1970, 1997, 2006]
  test_labels: [extremely_wet, wet, normal, dry, extremely_dry]
  episode_mode: random_training_year
  fixed_training_year: null  # --fixed-training-year YEAR enables an in-sample learning check.
  episodes: 300  # Total annual episodes, including the final partial batch.
  rollout_episodes: 6  # Freeze policy, collect six independent years, then update.
  eval_interval: 1  # HAPPO update rounds, not annual episode count.
  seeds: [1, 2, 3, 4, 5]
