# Physical assumptions; the variable-head table is a sensitivity scenario.
head_model: storage_sensitivity  # fixed reproduces the original typical-head model
reservoir_ids: [WDD, BHT, XLD, XJB, THR]
level_bounds_m:
  WDD: [945, 975]
  BHT: [765, 825]
  XLD: [540, 600]
  XJB: [370, 380]
  THR: [145, 175]
efficiency: 0.90
water_density_kg_m3: 1000.0
gravity_m_s2: 9.81
timestep_seconds: 86400.0
release_mapping: quadratic
state_type: EP
terminal_storage_mode: initial
# Supplied scenario rules, including end-of-day flood ceilings and refill deadlines.
seasonal_constraints: true
# Illustrative sensitivity weights; these are not calibrated or monetary costs.
# Each metre of excess is normalized by its reservoir's operating level range;
# the five normalized excesses are averaged before applying each weight.
reward_penalties:
  enabled: true
  target_band_weight: 0.0
  daily_rise_weight: 0.10
  daily_fall_weight: 0.10
