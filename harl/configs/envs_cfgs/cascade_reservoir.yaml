# Physical assumptions; the variable-head table is a sensitivity scenario.
head_model: storage_sensitivity  # fixed reproduces the original typical-head model
reservoir_ids: [WDD, BHT, XLD, XJB, THR]
level_bounds_m:
  WDD: [945, 975]
  BHT: [765, 825]
  XLD: [540, 600]
  XJB: [370, 380]
  THR: [145, 175]
efficiency: 0.90
water_density_kg_m3: 1000.0
gravity_m_s2: 9.81
timestep_seconds: 86400.0
release_mapping: quadratic
# Supplied permitted levels for the state reached after each action date.
use_daily_level_limits: true
# Fixed guaranteed-output and ecological-flow thresholds from paper Table A.1.
load_service_requirements: true
# Requirement-relative shortfalls averaged over each fixed active reservoir set.
# Unit weights are prespecified tradeoffs, not calibrated or monetary costs.
reward_penalties:
  enabled: true
  guaranteed_output_weight: 1.0
  ecological_flow_weight: 1.0
